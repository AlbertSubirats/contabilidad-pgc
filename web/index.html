<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <title>Ayuda Contabilidad</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <h1>Ayuda Contabilidad</h1>
        <p>Una web para estudiar análisis contable y balances</p>

        <!-- Aviso para un enlace a una cuenta que no existe (#9999). Empieza
             escondido; app.js lo rellena y lo enseña cuando hace falta. -->
        <p id="aviso-cuenta" class="aviso-sin-texto" hidden></p>

        <!-- La ficha de la cuenta pulsada. Aquí está su esqueleto; app.js solo
             rellena los huecos. Empieza escondida porque aún no se ha elegido cuenta. -->
        <article id="ficha-cuenta" hidden>
            <h2 id="ficha-titulo"></h2>
            <p id="ficha-etiquetas"></p>

            <h3>Definición</h3>
            <div id="ficha-definicion"></div>

            <h3>Presentación en el balance</h3>
            <div id="ficha-presentacion"></div>

            <h3>Movimiento</h3>
            <div class="movimiento">
                <section class="columna-cargo">
                    <h4>Se cargará <span class="lado">Debe</span></h4>
                    <ol id="ficha-cargos"></ol>
                </section>

                <section class="columna-abono">
                    <h4>Se abonará <span class="lado">Haber</span></h4>
                    <ol id="ficha-abonos"></ol>
                </section>
            </div>
        </article>

        <!-- Empieza vacío: el árbol lo crea app.js con los datos del JSON -->
        <nav id="arbol-cuentas"></nav>

        <!-- El "for" de la label apunta al "id" del input: así quedan unidos -->
        <label for="buscador">Buscar cuenta</label>
        <input type="search" id="buscador" placeholder="Código o nombre, por ejemplo 430 o clientes" autocomplete="off">

        <!-- Empieza vacía: los elementos los crea app.js con los datos del JSON -->
        <ul id="lista-cuentas"></ul>

        <!-- Al final del body para que, cuando se ejecute, la lista de arriba ya exista -->
        <script src="app.js"></script>
    </body>
</html>
