<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <!-- Con esta línea los móviles usan su ancho de verdad y las media  queries de styles.css funcionan -->
         <meta name="viewport" content=" width=device-width, initial-scale=1">
        <title>Cuentas PGC</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <!-- La página tiene cuatro zonas: la cabecera arriba, y debajo tres
             columnas (el árbol, la ficha y la ficha rápida). Dónde va cada una
             lo decide styles.css; aquí solo se dice qué es cada cosa. -->

        <!-- Cabecera: el nombre de la web, a la izquierda, y el buscador. -->
        <header class="cabecera">
            <!-- El nombre de la web lleva al inicio: href="#" deja la URL sin
                 código de cuenta, y el enrutador de app.js quita la ficha.
                 No es el <h1>: el título principal de cada página es el de
                 la ficha, que es lo que cambia de una a otra. -->
            <a class="nombre-web" href="#">Cuentas PGC</a>

            <div class="buscador">
                <!-- La caja, como en la maqueta B: la lupa, el sitio para
                     escribir y el número de resultados, en una fila. El borde
                     es de este div, no del input, para que los tres queden
                     dentro del mismo recuadro. -->
                <div class="caja-busqueda">
                    <!-- La lupa, dibujada con SVG: un círculo y una raya.
                         aria-hidden="true" le dice al lector de pantalla
                         que es decoración y no la lea. -->
                    <svg class="lupa" viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="10" cy="10" r="6.5"></circle>
                        <line x1="15" y1="15" x2="21" y2="21"></line>
                    </svg>

                    <!-- Ya no hay <label> a la vista. aria-label da al input
                         el nombre que leería el lector de pantalla. -->
                    <input type="search" id="buscador" aria-label="Buscar cuenta" placeholder="Código o nombre, por ejemplo 430 o clientes" autocomplete="off">

                    <!-- "34 resultados". Vacío hasta que se escribe; lo rellena app.js. -->
                    <span id="contador-resultados"></span>
                </div>

                <!-- Los resultados, como lista desplegable bajo la caja, con su
                     título encima. Empieza escondida: app.js rellena la lista
                     y enseña el desplegable al escribir. -->
                <div id="desplegable-buscador" hidden>
                    <p class="titulo-desplegable">Cuentas</p>
                    <ul id="lista-cuentas"></ul>
                </div>
            </div>
        </header>

        <!-- Columna izquierda: el cuadro de cuentas -->
        <aside class="columna-arbol">
            <h2>Cuadro de cuentas</h2>
            <!-- Empieza vacío: el árbol lo crea app.js con los datos del JSON -->
            <nav id="arbol-cuentas"></nav>
        </aside>

        <!-- Columna central: la ficha de la cuenta, que es lo principal -->
        <main class="columna-ficha">
            <!-- Aviso para un enlace a una cuenta que no existe (#9999). Empieza
                 escondido; app.js lo rellena y lo enseña cuando hace falta. -->
            <p id="aviso-cuenta" class="aviso-sin-texto" hidden></p>

            <!-- La ficha de la cuenta pulsada. Aquí está su esqueleto; app.js solo
                 rellena los huecos. Empieza escondida porque aún no se ha elegido cuenta. -->
            <article id="ficha-cuenta" hidden>
                <!-- Migas de pan: "Grupo 4 › Subgrupo 43 › 430", dónde está la
                     cuenta dentro del cuadro. Las rellena app.js. -->
                <nav id="ficha-migas" class="migas" aria-label="Dónde está esta cuenta"></nav>

                <!-- El título de la ficha es el <h1>, el título principal de la
                     página. Debajo, los apartados son <h2> y las columnas del
                     movimiento, <h3>: los niveles van de uno en uno, sin
                     saltarse ninguno, que es como los recorre un lector de pantalla. -->
                <h1 id="ficha-titulo"></h1>
                <p id="ficha-etiquetas"></p>

                <h2>Definición</h2>
                <div id="ficha-definicion"></div>

                <h2>Presentación en el balance</h2>
                <div id="ficha-presentacion"></div>

                <h2>Movimiento</h2>
                <div class="movimiento">
                    <section class="columna-cargo">
                        <h3>Se cargará <span class="lado">Debe</span></h3>
                        <ol id="ficha-cargos"></ol>
                    </section>

                    <section class="columna-abono">
                        <h3>Se abonará <span class="lado">Haber</span></h3>
                        <ol id="ficha-abonos"></ol>
                    </section>
                </div>
            </article>
        </main>

        <!-- Columna derecha: la ficha rápida. Escondida hasta que haya cuenta. -->
        <aside id="ficha-rapida" class="columna-ficha-rapida" hidden>
            <!-- Dos cajas, como en la maqueta D: cada una con su título en una
                 franja y el contenido debajo. -->
            <section class="caja">
                <h2>Ficha rápida</h2>
                <!-- Lista de pares "dato: valor" (Plan: PGC normal...). La rellena app.js. -->
                <dl id="ficha-rapida-datos"></dl>
            </section>

            <!-- Las contrapartidas de la ficha, reunidas, solo con el número (el
                 nombre sale al pasar el ratón). Cada lista va dentro de la
                 misma clase que su columna del movimiento (columna-cargo,
                 columna-abono), así heredan los colores cruzados. -->
            <section class="caja">
                <h2>Contrapartidas</h2>
                <section class="columna-cargo">
                    <h3>De los cargos</h3>
                    <ul id="ficha-rapida-cargos"></ul>
                </section>

                <section class="columna-abono">
                    <h3>De los abonos</h3>
                    <ul id="ficha-rapida-abonos"></ul>
                </section>
            </section>
        </aside>

        <!-- Al final del body para que, cuando se ejecute, todo lo de arriba ya exista -->
        <script src="app.js"></script>
    </body>
</html>
